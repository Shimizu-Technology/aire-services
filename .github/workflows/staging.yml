name: Staging images

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aire_ops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aire_ops_test
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - run: bin/rails db:schema:load
      - run: bundle exec rspec
      - run: bin/brakeman --no-pager
      - run: bin/bundler-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  staging-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build --file backend/Dockerfile --tag aire-services-api:ci backend
      - name: Build web image
        env:
          STAGING_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
        run: >-
          docker build --file frontend/Dockerfile --tag aire-services-web:ci
          --build-arg VITE_API_URL=
          --build-arg VITE_CLERK_PUBLISHABLE_KEY="${STAGING_CLERK_PUBLISHABLE_KEY}"
          frontend
      - name: Validate staging Caddyfile
        run: >-
          docker run --rm --entrypoint caddy aire-services-web:ci
          validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [backend, frontend, staging-configuration]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: aire-services-api
            context: backend
            file: backend/Dockerfile
          - image: aire-services-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        if: matrix.image == 'aire-services-api'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/shimizu-technology/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/shimizu-technology/${{ matrix.image }}:staging
      - name: Build and publish web image
        if: matrix.image == 'aire-services-web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/shimizu-technology/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/shimizu-technology/${{ matrix.image }}:staging
          build-args: |
            VITE_API_URL=
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
