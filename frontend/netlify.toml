[build]
  ignore = "bash scripts/netlify-ignore-build.sh"
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

# Opt-in replacement for the manual staging site; see docs/NETLIFY_STAGING.md.
# No production build settings are overridden here.
[context.branch-deploy]
  command = "node scripts/netlify-staging-build.mjs"

[context.deploy-preview]
  command = "node scripts/netlify-staging-build.mjs"
